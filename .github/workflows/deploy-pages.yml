name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/deploy-pages.yml"
      - ".github/workflows/static.yml"
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Configure frontend API URL
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
        run: |
          node -e 'const fs = require("node:fs"); const apiBaseUrl = (process.env.API_BASE_URL || "").trim().replace(/\/+$/, ""); fs.writeFileSync("frontend/public/config.js", `window.REEL_RUSH_CONFIG = { apiBaseUrl: ${JSON.stringify(apiBaseUrl)} };\n`);'

      - name: Build frontend
        run: npm --prefix frontend run build -- --base-href "/${{ github.event.repository.name }}/"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist/frontend/browser

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
